<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Battle X - Multi-Bonus</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 50%, #0f0a1f 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100dvh; 
            min-height: 100vh;
            overflow: hidden; 
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
        }
        #gameWrap {
            position: relative;
            width: min(420px, 100vw);
            height: min(650px, 100dvh);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { 
            display: block;
            width: min(420px, 100vw);
            height: min(650px, 100dvh);
            max-width: 100vw;
            max-height: 100dvh;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 30px rgba(0, 255, 255, 0.1);
            background: radial-gradient(circle at 30% 20%, #1a0a3e, #0a0a1f, #000);
        }

        #nameScreen {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(3, 3, 12, 0.98);
            pointer-events: auto;
        }

        .nameBox {
            width: min(360px, 88vw);
            padding: 26px 20px;
            text-align: center;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0,255,255,.35);
            background: #08081a;
        }

        .nameTitle {
            color: #00ffff;
            font: bold 28px Arial, sans-serif;
            margin-bottom: 16px;
        }

        .nameSubtitle {
            color: #fff;
            font: bold 14px Arial, sans-serif;
            margin-bottom: 14px;
        }

        #playerNameInput {
            display: block;
            width: 100%;
            height: 48px;
            padding: 8px 12px;
            border: 2px solid #00ffff;
            background: #02020c;
            color: white;
            outline: none;
            text-align: center;
            font: bold 18px Arial, sans-serif;
            margin-bottom: 12px;
        }

        #nameConfirmBtn {
            display: block;
            width: 100%;
            height: 48px;
            border: none;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            color: #000;
            font: bold 17px Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }

        #nameError {
            height: 20px;
            margin-top: 8px;
            color: #ff4444;
            font: bold 13px Arial, sans-serif;
        }


        #onlineScreen {
            position:absolute; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
            background:rgba(3,3,12,.97); pointer-events:auto;
        }
        .onlineBox { width:min(370px,88vw); padding:24px 20px; text-align:center; border:2px solid #00ffff;
            box-shadow:0 0 30px rgba(0,255,255,.35); background:#08081a; }
        .onlineTitle { color:#00ffff; font:bold 27px Arial,sans-serif; margin-bottom:10px; }
        .onlineHint { color:#ddd; font:14px Arial,sans-serif; line-height:1.4; margin-bottom:14px; }
        #serverUrlInput,#roomInput { display:block; width:100%; height:46px; box-sizing:border-box; margin:8px 0;
            padding:8px 12px; border:2px solid #00ffff; background:#02020c; color:#fff; outline:none; text-align:center; font:bold 16px Arial,sans-serif; }
        .onlineRow { display:flex; gap:8px; margin-top:10px; }
        .onlineRow button { flex:1; height:46px; border:0; font:bold 15px Arial,sans-serif; cursor:pointer; touch-action:manipulation; }
        #onlineConnectBtn { background:linear-gradient(90deg,#00ff88,#00ffff); color:#000; }
        #onlineBackBtn { background:#25253a; color:#fff; border:1px solid #777 !important; }
        #onlineStatus { min-height:20px; margin-top:10px; color:#00ff88; font:bold 13px Arial,sans-serif; }

        #mobileControls {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .moveControls, .actionControls {
            position: absolute;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .moveControls { left: 14px; }
        .actionControls { right: 14px; }

        .controlBtn {
            width: 58px;
            height: 58px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            background: rgba(0, 20, 35, 0.72);
            color: #00ffff;
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
            font: bold 24px Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        .fireBtn {
            color: #ffff00;
            border-color: #ffff00;
            box-shadow: 0 0 14px rgba(255, 255, 0, 0.35);
        }

        .shieldBtn {
            color: #ff00ff;
            border-color: #ff00ff;
            box-shadow: 0 0 14px rgba(255, 0, 255, 0.35);
            display: none;
        }

        .controlBtn:active {
            transform: scale(0.92);
            background: rgba(0, 255, 255, 0.25);
        }

        @media (pointer: coarse), (max-width: 700px) {
            #mobileControls { display: block; }
        }

        @media (orientation: landscape) and (max-height: 700px) {
            #gameWrap { height: 100dvh; }
            .controlBtn { width: 52px; height: 52px; }
            .moveControls, .actionControls { bottom: 10px; }
        }

    </style>
</head>
<body>

<div id="gameWrap">
    <div id="nameScreen">
        <div class="nameBox">
            <div class="nameTitle">SPACE BATTLE X</div>
            <div class="nameSubtitle">ELIGE TU NOMBRE DE JUGADOR</div>
            <input id="playerNameInput" type="text" maxlength="16"
                   autocomplete="off" autocapitalize="words"
                   placeholder="Tu nombre...">
            <button id="nameConfirmBtn" type="button">CONTINUAR</button>
            <div id="nameError"></div>
        </div>
    </div>
    <div id="onlineScreen">
  <div class="onlineBox">
    <div class="onlineTitle">🌐 MODO ONLINE</div>
    <div class="onlineHint">Crea o entra en una sala para jugar con otros jugadores.</div>
    <input id="serverUrlInput" placeholder="Servidor WebSocket" autocomplete="off">
    <input id="roomInput" maxlength="12" placeholder="Código de sala" autocomplete="off">
    <div class="onlineRow">
      <button id="onlineConnectBtn">CONECTAR</button>
      <button id="onlineBackBtn">VOLVER</button>
    </div>
    <div id="onlineStatus">Desconectado</div>
  </div>
</div>
<canvas id="game" width="420" height="650"></canvas>

    <div id="mobileControls" aria-hidden="true">
        <div class="moveControls">
            <button id="leftBtn" class="controlBtn">◀</button>
            <button id="rightBtn" class="controlBtn">▶</button>
        </div>
        <div class="actionControls">
            <button id="shieldBtn" class="controlBtn shieldBtn">◆</button>
            <button id="fireBtn" class="controlBtn fireBtn">●</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const nameScreen = document.getElementById("nameScreen");
const playerNameInput = document.getElementById("playerNameInput");
const nameConfirmBtn = document.getElementById("nameConfirmBtn");
const nameError = document.getElementById("nameError");

let playerName = "";
let state = "name";

function confirmPlayerName() {
    const name = playerNameInput.value.trim();

    if (name.length < 2) {
        nameError.textContent = "Escribe al menos 2 caracteres.";
        playerNameInput.focus();
        return;
    }

    playerName = name.substring(0, 16);
    writeStorage("spacePlayerName", playerName);

    nameScreen.style.display = "none";
    state = "lobby";
}

nameConfirmBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    confirmPlayerName();
});

playerNameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        confirmPlayerName();
    }
});

if (playerName) {
    playerNameInput.value = playerName;
    nameScreen.style.display = "none";
    state = "lobby";
}


const onlineScreen = document.getElementById("onlineScreen");
const serverUrlInput = document.getElementById("serverUrlInput");
const roomInput = document.getElementById("roomInput");
const onlineConnectBtn = document.getElementById("onlineConnectBtn");
const onlineBackBtn = document.getElementById("onlineBackBtn");
const onlineStatus = document.getElementById("onlineStatus");

function defaultWsUrl() {
    // Servidor de Render de Space Battle X
    return "wss://battle-space-x.onrender.com";
}
serverUrlInput.value = defaultWsUrl();

function showOnline() {
    onlineScreen.style.display = "flex";
    state = "onlineLobby";
    onlineStatus.textContent = "Desconectado";
    onlineStatus.style.color = "#ffaa00";
}

function closeOnline() {
    disconnectOnline();
    onlineScreen.style.display = "none";
    state = "lobby";
}

function connectOnline() {
    const url = serverUrlInput.value.trim() || defaultWsUrl();
    const room = (roomInput.value.trim() || "PUBLIC").toUpperCase().replace(/[^A-Z0-9_-]/g, "").slice(0,12);
    if (!room) { onlineStatus.textContent = "Escribe un código de sala."; return; }
    if (onlineSocket) onlineSocket.close();
    onlineStatus.textContent = "Conectando...";
    try { onlineSocket = new WebSocket(url); } catch(e) { onlineStatus.textContent = "URL no válida."; return; }
    onlineSocket.addEventListener("open", () => {
        onlineConnected = true; onlineRoom = room;
        onlineSocket.send(JSON.stringify({type:"join", room, name:playerName, ship:shipIndex, x:player.x, y:player.y}));
        onlineStatus.textContent = "🟢 Conectado · Sala " + room + " — entrando...";
        onlineStatus.style.color = "#00ff88";
        setTimeout(startOnlineGame, 250);
    });
    onlineSocket.addEventListener("message", e => {
        try {
            const msg = JSON.parse(e.data);
            if (msg.type === "players") onlinePlayers = msg.players || {};
        } catch(_) {}
    });
    onlineSocket.addEventListener("close", () => {
        onlineConnected = false; onlinePlayers = {};
        if (state === "onlineGame") state = "lobby";
        onlineStatus.textContent = "🔴 Desconectado";
        onlineStatus.style.color = "#ff5555";
    });
    onlineSocket.addEventListener("error", () => {
        onlineStatus.textContent = "No se pudo conectar al servidor.";
        onlineStatus.style.color = "#ff5555";
    });
}

function disconnectOnline() {
    if (onlineSocket) { try { onlineSocket.close(); } catch(_) {} }
    onlineSocket = null; onlineConnected = false; onlinePlayers = {};
}

onlineConnectBtn.addEventListener("pointerdown", e => { e.preventDefault(); connectOnline(); });
onlineBackBtn.addEventListener("pointerdown", e => { e.preventDefault(); closeOnline(); });

function startOnlineGame() {
    if (!onlineConnected) return;
    bullets = []; enemies = []; particles = []; bonuses = [];
    enemyTimer = 0; speedTimer = 0; multiTimer = 0; shieldActive = false; shieldReady = false; enemyKills = 0;
    player.x = 210; state = "onlineGame";
}

function sendOnlineState() {
    const now = performance.now();
    if (!onlineConnected || !onlineSocket || onlineSocket.readyState !== WebSocket.OPEN || now-onlineLastSend < 50) return;
    onlineLastSend = now;
    onlineSocket.send(JSON.stringify({type:"update", x:player.x, y:player.y, ship:shipIndex, name:playerName, score:score}));
}

function drawOnlinePlayers() {
    for (const id in onlinePlayers) {
        const p = onlinePlayers[id];
        if (!p || p.self) continue;
        // El servidor actual no marca todavía el jugador propio; evitamos duplicarlo
        // cuando coincide exactamente con nuestra posición y nombre.
        if (p.name === playerName && Number(p.x) === Number(player.x) && Number(p.y) === Number(player.y)) continue;
        ctx.save();
        ctx.shadowBlur = 18; ctx.shadowColor = ships[p.ship]?.glow || "#00ffff";
        drawShip(Number(p.x)||210, Number(p.y)||560, ships[p.ship]?.color || "#00ffff", 30);
        ctx.shadowBlur = 0;
        ctx.textAlign = "center"; ctx.font = "bold 12px Arial"; ctx.fillStyle = "#fff";
        ctx.fillText((p.name || "Jugador").slice(0,16), Number(p.x)||210, (Number(p.y)||560)-34);
        ctx.restore();
    }
}


let keys = {}, bullets = [], enemies = [], particles = [], stars = [], bonuses = [];
let enemyTimer = 0;

// ⚡ STATUS INDEPENDIENTES
let speedTimer = 0;
let multiTimer = 0;
const BONUS_DURATION = 400; 

// 🛡️ ESCUDO
let shieldReady = false, shieldActive = false, shieldTimer = 0, enemyKills = 0;

// 💾 DATOS

function readStorage(key) {
    try { return localStorage.getItem(key); }
    catch (e) { return null; }
}

function writeStorage(key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) {}
}

playerName = readStorage("spacePlayerName") || "";

let defaultSave = { score: 0, owned: [true, false, false, false, false] };
let save;
try {
    save = JSON.parse(readStorage("spaceSave")) || defaultSave;
    if (!Array.isArray(save.owned) || save.owned.length !== 5) {
        save.owned = defaultSave.owned.slice();
    }
    if (!Number.isFinite(save.score)) save.score = 0;
} catch (e) {
    save = { score: 0, owned: [true, false, false, false, false] };
}

let score = save.score;

const ships = [
    { color: "#00ffff", speed: 6, price: 0, glow: "#00ffff" },
    { color: "#ff0066", speed: 6, price: 100, glow: "#ff00ff" },
    { color: "#00ff88", speed: 8, price: 250, glow: "#00ff88" },
    { color: "#ff6b00", speed: 7, price: 500, glow: "#ffaa00" },
    { color: "#ff00ff", speed: 7, price: 1200, glow: "#ff00ff" }
];

let shipIndex = 0;
const player = { x: 210, y: 560 };

// 🌐 ONLINE
let onlineSocket = null;
let onlineRoom = "";
let onlinePlayers = {};
let onlineConnected = false;
let onlineLastSend = 0;

for(let i=0; i<150; i++) stars.push({ x: Math.random()*420, y: Math.random()*650, s: Math.random()*2.5 + 0.5, br: Math.random()*255 });

// --- CLICS ---
canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    if(state === "lobby") {
        if(mx > 100 && mx < 320 && my > 400 && my < 460) startGame();
        // ONLINE
        if(mx > 100 && mx < 320 && my > 465 && my < 525) showOnline();
        if(Math.hypot(mx - 370, my - 580) < 30) state = "shop";
        if(mx > 45 && mx < 85 && my > 275 && my < 335) changeShip(-1);
        if(mx > 335 && mx < 375 && my > 275 && my < 335) changeShip(1);
    } else if(state === "shop") {
        if(mx > 80 && mx < 340 && my > 430 && my < 480) buyShip();
        if(my > 580) state = "lobby";
        if(mx > 45 && mx < 85 && my > 275 && my < 335) shipIndex = (shipIndex-1+ships.length)%ships.length;
        if(mx > 335 && mx < 375 && my > 275 && my < 335) shipIndex = (shipIndex+1)%ships.length;
    } else if(state === "gameover") state = "lobby";
});

document.addEventListener("keydown", e => {
    // Evita que la barra espaciadora haga scroll en ordenador.
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
    keys[e.key] = true;

    if(e.key === " " && (state === "game" || state === "onlineGame")) shoot();
    if(e.key === "Control" && state === "game" && shieldReady) activateShield();
});
document.addEventListener("keyup", e => keys[e.key] = false);
// --- CONTROLES TÁCTILES ---
const mobileControls = document.getElementById("mobileControls");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const fireBtn = document.getElementById("fireBtn");
const shieldBtn = document.getElementById("shieldBtn");

function setMove(key, active) {
    keys[key] = active;
}

function touchHold(button, key) {
    const start = e => {
        e.preventDefault();
        button.setPointerCapture?.(e.pointerId);
        setMove(key, true);
    };
    const end = e => {
        e.preventDefault();
        setMove(key, false);
    };
    button.addEventListener("pointerdown", start);
    button.addEventListener("pointerup", end);
    button.addEventListener("pointercancel", end);
    button.addEventListener("pointerleave", end);
}

touchHold(leftBtn, "ArrowLeft");
touchHold(rightBtn, "ArrowRight");

fireBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "game") shoot();
});

shieldBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "game" && shieldReady) activateShield();
});

function updateMobileControls() {
    const touchDevice = window.matchMedia("(pointer: coarse)").matches || window.innerWidth <= 700;
    if (!touchDevice) return;

    mobileControls.style.display = (state === "game" || state === "onlineGame") ? "block" : "none";
    shieldBtn.style.display =
        state === "game" && ships[shipIndex].color === "#ff00ff" ? "block" : "none";
}

window.addEventListener("resize", updateMobileControls);


function changeShip(dir) { do { shipIndex = (shipIndex + dir + ships.length) % ships.length; } while (!save.owned[shipIndex]); }
function saveGame() { save.score = score; writeStorage("spaceSave", JSON.stringify(save)); }
function startGame() { bullets = []; enemies = []; particles = []; bonuses = []; enemyTimer = 0; speedTimer = 0; multiTimer = 0; shieldActive = false; shieldReady = false; enemyKills = 0; player.x = 210; state = "game"; }
function buyShip() { let s = ships[shipIndex]; if(!save.owned[shipIndex] && score >= s.price) { score -= s.price; save.owned[shipIndex] = true; saveGame(); } }

function shoot() {
    if(multiTimer > 0) {
        bullets.push({x: player.x - 15, y: player.y}, {x: player.x, y: player.y}, {x: player.x + 15, y: player.y});
        particles.push({ x: player.x - 15, y: player.y, dx: 0, dy: 5, life: 15, c: "#00ffff" });
        particles.push({ x: player.x + 15, y: player.y, dx: 0, dy: 5, life: 15, c: "#00ffff" });
    } else {
        bullets.push({x: player.x, y: player.y});
        particles.push({ x: player.x, y: player.y, dx: 0, dy: 5, life: 12, c: "#00ff88" });
    }
}

function activateShield() { if(ships[shipIndex].color === "#ff00ff") { shieldActive = true; shieldReady = false; shieldTimer = 400; enemyKills = 0; } }

function explode(x, y, big = false) {
    let colors = big ? ["#ffaa00", "#ff6600", "#ff0000"] : ["#00ffff", "#00ff88", "#00aaff"];
    for(let i=0; i<(big?50:20); i++) {
        particles.push({ 
            x, y, 
            dx: (Math.random()-0.5)*(big?8:5), 
            dy: (Math.random()-0.5)*(big?8:5), 
            life: big ? 40 : 30, 
            c: colors[Math.floor(Math.random()*colors.length)]
        });
    }
}

function drawGradientText(text, x, y, size, color1, color2) {
    let gradient = ctx.createLinearGradient(x - text.length * size/2, y - size/2, x + text.length * size/2,
